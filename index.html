<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEDHA Money Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #10131c;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    header {
      padding: 20px 0;
    }

    header h1 {
      color: #62e6a5;
      margin-bottom: 8px;
    }

    header p {
      color: #aab2c5;
    }

    .card {
      background: #1b2130;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
      border: 1px solid #30394b;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .income {
      color: #62e6a5;
    }

    .expense {
      color: #ff7d91;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #cbd3e4;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #39445a;
      font-size: 16px;
    }

    input, select {
      background: #101622;
      color: white;
    }

    button {
      margin-top: 16px;
      background: #62e6a5;
      color: #10131c;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #30394b;
    }

    .transaction small {
      display: block;
      color: #aab2c5;
      margin-top: 5px;
    }

    .delete {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      background: #3b2631;
      color: #ff9aab;
    }

    .empty {
      color: #aab2c5;
      text-align: center;
      padding: 20px 0;
    }

    .note {
      color: #aab2c5;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>💰 VEDHA</h1>
      <p>Your personal money tracker</p>
    </header>

    <section class="card">
      <p>Total Balance</p>
      <div class="balance" id="balance">₹0.00</div>

      <div class="summary">
        <div>
          <p class="income">↗ Total Income</p>
          <strong id="income">₹0.00</strong>
        </div>

        <div>
          <p class="expense">↘ Total Expenses</p>
          <strong id="expense">₹0.00</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Add Transaction</h2>

      <form id="form">
        <label for="type">Transaction Type</label>
        <select id="type" required>
          <option value="income">Income (+)</option>
          <option value="expense">Expense (-)</option>
        </select>

        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" min="0.01"
          step="0.01" placeholder="Enter amount" required>

        <label for="category">Category</label>
        <select id="category" required>
          <option>Salary</option>
          <option>Business</option>
          <option>Investment</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Education</option>
          <option>Other</option>
        </select>

        <label for="description">Description</label>
        <input id="description" type="text"
          maxlength="100" placeholder="What was it for?">

        <label for="date">Date</label>
        <input id="date" type="date" required>

        <button type="submit">+ Add Transaction</button>
      </form>
    </section>

    <section class="card">
      <h2>Recent Transactions</h2>
      <div id="transactions"></div>
      <p class="note">
        Your records are stored in this browser on this device.
        Clearing browser data may delete them.
      </p>
    </section>
  </main>

  <script>
    const money = amount =>
      new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR"
      }).format(amount);

    const today = new Date();
    const localDate = [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2, "0"),
      String(today.getDate()).padStart(2, "0")
    ].join("-");

    document.getElementById("date").value = localDate;

    let transactions = [];

    try {
      const saved = localStorage.getItem("vedhaTransactions");
      const parsed = saved ? JSON.parse(saved) : [];
      if (Array.isArray(parsed)) {
        transactions = parsed.filter(t =>
          t &&
          typeof t.id === "string" &&
          (t.type === "income" || t.type === "expense") &&
          Number.isFinite(t.amount) &&
          t.amount > 0 &&
          typeof t.category === "string" &&
          typeof t.date === "string"
        );
      }
    } catch {
      transactions = [];
    }

    function save() {
      try {
        localStorage.setItem(
          "vedhaTransactions",
          JSON.stringify(transactions)
        );
        return true;
      } catch {
        alert("Could not save data in this browser.");
        return false;
      }
    }

    function render() {
      const income = transactions
        .filter(t => t.type === "income")
        .reduce((sum, t) => sum + t.amount, 0);

      const expense = transactions
        .filter(t => t.type === "expense")
        .reduce((sum, t) => sum + t.amount, 0);

      document.getElementById("balance").textContent =
        money(income - expense);

      document.getElementById("income").textContent = money(income);
      document.getElementById("expense").textContent = money(expense);

      const list = document.getElementById("transactions");
      list.replaceChildren();

      if (transactions.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No transactions yet. Add your first one!";
        list.appendChild(empty);
        return;
      }

      [...transactions]
        .sort((a, b) => b.date.localeCompare(a.date) ||
          b.id.localeCompare(a.id))
        .forEach(t => {
          const row = document.createElement("div");
          row.className = "transaction";

          const details = document.createElement("div");
          const title = document.createElement("strong");
          title.textContent = t.category;

          const description = document.createElement("small");
          description.textContent =
            (t.description || t.category) + " • " + t.date;

          details.append(title, description);

          const right = document.createElement("div");
          right.style.textAlign = "right";

          const amount = document.createElement("strong");
          amount.className = t.type;
          amount.textContent =
            (t.type === "income" ? "+" : "-") + money(t.amount);

          const remove = document.createElement("button");
          remove.className = "delete";
          remove.textContent = "Delete";
          remove.setAttribute("aria-label", "Delete transaction");

          remove.addEventListener("click", () => {
            if (confirm("Delete this transaction?")) {
              const previous = transactions;
              transactions = transactions.filter(x => x.id !== t.id);

              if (save()) {
                render();
              } else {
                transactions = previous;
              }
            }
          });

          right.append(amount, remove);
          row.append(details, right);
          list.appendChild(row);
        });
    }

    document.getElementById("form").addEventListener("submit", event => {
      event.preventDefault();

      const amount = Number(document.getElementById("amount").value);
      const date = document.getElementById("date").value;

      if (!Number.isFinite(amount) || amount <= 0 || !date) {
        alert("Please enter a valid amount and date.");
        return;
      }

      const transaction = {
        id: crypto.randomUUID(),
        type: document.getElementById("type").value,
        amount,
        category: document.getElementById("category").value,
        description: document.getElementById("description").value.trim(),
        date
      };

      transactions.push(transaction);

      if (save()) {
        event.target.reset();
        document.getElementById("date").value = localDate;
        render();
      } else {
        transactions.pop();
      }
    });

    render();
  </script>
</body>
  </html>
